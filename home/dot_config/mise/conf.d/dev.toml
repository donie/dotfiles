# mise dev set: every role except server.

[tools]
node = "lts"
rust = "stable"  # mise drives rustup; toolchains live in ~/.rustup
ruby = "3.4"
go = "latest"
java = "temurin-17"
bun = "latest"
pnpm = "latest"
yarn = "latest"
maven = "latest"
terraform = "latest"
mkcert = "latest"
golangci-lint = "latest"
tokei = "latest"  # releases since v13 ship no binaries: built with cargo (rust above)
codex = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"pipx:git-filter-repo" = "latest"
"npm:agent-browser" = "latest"
"npm:@slidev/cli" = "latest"
"npm:defuddle" = "latest"
xcodegen = { version = "latest", os = ["macos"] }

[settings]
# Use Go's defaults on every OS (GOPATH=~/go, `go install` → ~/go/bin, which the
# shells add to PATH). By default mise points GOBIN at the active Go version's
# directory, so `go install`ed commands would vanish on every Go upgrade.
# Tools that should be tracked go in [tools] with the go: backend instead.
go.set_gobin = false
